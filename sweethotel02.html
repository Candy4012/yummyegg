<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>住咗間有入無出嘅酒店</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=ZCOOL+KuaiLe&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-dark: #0a0a0f;
  --bg-card: #12121a;
  --text-main: #c8c0b0;
  --text-dim: #6a6460;
  --text-bright: #e8e0d0;
  --accent-red: #8b2020;
  --accent-red-glow: #c0392b;
  --accent-gold: #b8860b;
  --accent-green: #2d5a27;
  --border-subtle: #2a2a35;
}

html, body { 
  height: 100%; 
  background: var(--bg-dark); 
  color: var(--text-main);
  font-family: 'Noto Serif TC', serif;
  overflow: hidden;
}

.hidden { display: none !important; }

/* Title Screen */
#title-screen {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg-dark);
  z-index: 100;
}

.rain-overlay {
  position: absolute; inset: 0;
  background: repeating-linear-gradient(
    transparent, transparent 4px,
    rgba(100,100,140,0.03) 4px, rgba(100,100,140,0.03) 5px
  );
  animation: rain 0.8s linear infinite;
  pointer-events: none;
}

@keyframes rain {
  0% { transform: translateY(-10px); }
  100% { transform: translateY(10px); }
}

.title-content {
  text-align: center;
  z-index: 2;
  animation: fadeInUp 1.5s ease;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

.hotel-icon {
  font-size: 4rem;
  margin-bottom: 1rem;
  filter: grayscale(0.5);
  animation: flicker 3s infinite;
}

@keyframes flicker {
  0%, 95%, 100% { opacity: 1; }
  96% { opacity: 0.3; }
  97% { opacity: 0.8; }
  98% { opacity: 0.2; }
}

.glitch {
  font-size: clamp(1.5rem, 5vw, 2.8rem);
  font-weight: 900;
  color: var(--text-bright);
  letter-spacing: 0.1em;
  position: relative;
  text-shadow: 0 0 20px rgba(139,32,32,0.4);
}

.glitch::before, .glitch::after {
  content: attr(data-text);
  position: absolute; left: 0; top: 0;
  width: 100%; height: 100%;
}
.glitch::before {
  color: var(--accent-red);
  animation: glitch1 4s infinite;
  clip-path: inset(0 0 80% 0);
}
.glitch::after {
  color: #1a4a6a;
  animation: glitch2 4s infinite;
  clip-path: inset(80% 0 0 0);
}

@keyframes glitch1 {
  0%, 90%, 100% { transform: translate(0); }
  92% { transform: translate(-3px, 1px); }
  94% { transform: translate(3px, -1px); }
  96% { transform: translate(-1px, 2px); }
}
@keyframes glitch2 {
  0%, 88%, 100% { transform: translate(0); }
  90% { transform: translate(2px, -1px); }
  93% { transform: translate(-2px, 1px); }
  95% { transform: translate(1px, -2px); }
}

.subtitle {
  font-size: 1rem;
  color: var(--text-dim);
  margin-top: 0.8rem;
  letter-spacing: 0.3em;
}

.credit {
  font-size: 0.75rem;
  color: var(--text-dim);
  margin-top: 2rem;
  opacity: 0.5;
}

.start-btn {
  margin-top: 2.5rem;
  padding: 1rem 3rem;
  background: transparent;
  border: 1px solid var(--accent-red);
  color: var(--text-bright);
  font-family: 'Noto Serif TC', serif;
  font-size: 1.1rem;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: all 0.4s;
  letter-spacing: 0.2em;
}

.start-btn:hover {
  background: var(--accent-red);
  box-shadow: 0 0 30px rgba(139,32,32,0.5);
  transform: scale(1.05);
}

.start-btn::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
  transform: translateX(-100%);
  animation: shimmer 3s infinite;
}

@keyframes shimmer {
  100% { transform: translateX(100%); }
}

.hint {
  margin-top: 1.5rem;
  font-size: 0.7rem;
  color: var(--text-dim);
  opacity: 0.4;
}

/* Game Screen */
#game-screen {
  display: flex;
  flex-direction: column;
  height: 100vh;
  max-width: 700px;
  margin: 0 auto;
  padding: 0 1rem;
}

.game-header {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 0.8rem 0;
  border-bottom: 1px solid var(--border-subtle);
  flex-shrink: 0;
}

.floor-indicator {
  background: var(--accent-red);
  color: #fff;
  font-size: 0.8rem;
  font-weight: 700;
  padding: 0.3rem 0.7rem;
  border-radius: 3px;
  font-family: monospace;
  min-width: 50px;
  text-align: center;
  box-shadow: 0 0 10px rgba(139,32,32,0.5);
}

.status-bar {
  display: flex;
  gap: 1rem;
  flex: 1;
  align-items: center;
}

.status-item {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.75rem;
}

.status-label {
  color: var(--text-dim);
  white-space: nowrap;
}

.bar-fill {
  width: 60px;
  height: 6px;
  background: var(--border-subtle);
  border-radius: 3px;
  overflow: hidden;
}

.bar-value {
  height: 100%;
  background: var(--accent-green);
  transition: width 0.5s, background 0.5s;
  border-radius: 3px;
}

#inventory-text {
  color: var(--accent-gold);
  font-size: 0.7rem;
  max-width: 120px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Story Container */
#story-container {
  flex: 1;
  overflow-y: auto;
  padding: 1.5rem 0;
  scroll-behavior: smooth;
  mask-image: linear-gradient(to bottom, transparent 0%, black 3%, black 90%, transparent 100%);
}

#story-container::-webkit-scrollbar { width: 3px; }
#story-container::-webkit-scrollbar-track { background: transparent; }
#story-container::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 3px; }

#story-text {
  line-height: 2;
  font-size: 1rem;
  color: var(--text-main);
}

#story-text p {
  margin-bottom: 1rem;
  animation: textFadeIn 0.6s ease;
}

@keyframes textFadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

#story-text .dialogue {
  color: var(--text-bright);
  padding-left: 1rem;
  border-left: 2px solid var(--accent-red);
  margin: 0.8rem 0;
}

#story-text .narration {
  color: var(--text-dim);
  font-style: italic;
}

#story-text .emphasis {
  color: var(--accent-red-glow);
  font-weight: 700;
}

#story-text .scene-break {
  text-align: center;
  color: var(--text-dim);
  margin: 1.5rem 0;
  letter-spacing: 1em;
}

/* Choices */
#choices-container {
  padding: 1rem 0;
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
}

.choice-btn {
  display: block;
  width: 100%;
  padding: 0.9rem 1.2rem;
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  color: var(--text-main);
  font-family: 'Noto Serif TC', serif;
  font-size: 0.9rem;
  text-align: left;
  cursor: pointer;
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
  animation: choiceFadeIn 0.5s ease;
  animation-fill-mode: backwards;
}

.choice-btn:nth-child(1) { animation-delay: 0.3s; }
.choice-btn:nth-child(2) { animation-delay: 0.5s; }
.choice-btn:nth-child(3) { animation-delay: 0.7s; }
.choice-btn:nth-child(4) { animation-delay: 0.9s; }

@keyframes choiceFadeIn {
  from { opacity: 0; transform: translateX(-10px); }
  to { opacity: 1; transform: translateX(0); }
}

.choice-btn:hover {
  border-color: var(--accent-red);
  background: rgba(139,32,32,0.1);
  color: var(--text-bright);
  padding-left: 1.5rem;
}

.choice-btn::before {
  content: '>';
  position: absolute;
  left: 0.5rem;
  opacity: 0;
  color: var(--accent-red);
  transition: opacity 0.3s;
}

.choice-btn:hover::before {
  opacity: 1;
}

.choice-btn.danger { border-color: var(--accent-red); }
.choice-btn.danger:hover { background: rgba(139,32,32,0.2); }

/* Game Footer */
.game-footer {
  padding: 0.5rem 0;
  border-top: 1px solid var(--border-subtle);
  text-align: center;
  flex-shrink: 0;
}

.footer-btn {
  background: none;
  border: none;
  color: var(--text-dim);
  font-family: 'Noto Serif TC', serif;
  font-size: 0.75rem;
  cursor: pointer;
  padding: 0.5rem 1rem;
  transition: color 0.3s;
}

.footer-btn:hover { color: var(--accent-red); }

/* Ending Screen */
.ending-screen {
  text-align: center;
  padding: 2rem 0;
}

.ending-screen h2 {
  font-size: 1.5rem;
  color: var(--accent-red-glow);
  margin-bottom: 1rem;
}

.ending-screen .ending-type {
  font-size: 0.8rem;
  color: var(--accent-gold);
  letter-spacing: 0.3em;
  margin-bottom: 2rem;
}

/* Screen effects */
.screen-flash {
  position: fixed; inset: 0;
  background: white;
  z-index: 999;
  animation: flash 0.3s ease-out forwards;
  pointer-events: none;
}

@keyframes flash {
  from { opacity: 0.7; }
  to { opacity: 0; }
}

.screen-dark {
  position: fixed; inset: 0;
  background: black;
  z-index: 999;
  animation: darkFade 1.5s ease forwards;
  pointer-events: none;
}

@keyframes darkFade {
  0% { opacity: 1; }
  100% { opacity: 0; }
}

/* Responsive */
@media (max-width: 600px) {
  #game-screen { padding: 0 0.8rem; }
  #story-text { font-size: 0.95rem; }
  .choice-btn { font-size: 0.85rem; padding: 0.8rem 1rem; }
}
</style>
</head>
<body>
<div id="app">
  <div id="title-screen">
    <div class="title-content">
      <div class="hotel-icon">🏨</div>
      <h1 class="glitch" data-text="住咗間有入無出嘅酒店">住咗間有入無出嘅酒店</h1>
      <p class="subtitle">一個文字冒險遊戲</p>
      <p class="credit">原著：香蕉可可（墨說）@ LIHKG 講故台</p>
      <button id="start-btn" class="start-btn">
        <span>入住酒店</span>
      </button>
      <p class="hint">建議戴耳機，關燈遊玩</p>
    </div>
    <div class="rain-overlay"></div>
  </div>
  <div id="game-screen" class="hidden">
    <div class="game-header">
      <div class="floor-indicator">
        <span id="floor-text">24F</span>
      </div>
      <div class="status-bar">
        <div class="status-item" id="sanity-bar">
          <span class="status-label">理智</span>
          <div class="bar-fill"><div class="bar-value" id="sanity-value"></div></div>
        </div>
        <div class="status-item" id="inventory-display">
          <span class="status-label">物品</span>
          <span id="inventory-text">無</span>
        </div>
      </div>
    </div>
    <div id="story-container">
      <div id="story-text"></div>
      <div id="choices-container"></div>
    </div>
    <div class="game-footer">
      <button id="restart-btn" class="footer-btn">重新開始</button>
    </div>
  </div>
</div>
<script>
// ===== GAME ENGINE =====
const state = {
  sanity: 100,
  inventory: [],
  flags: {},
  currentScene: null,
  history: []
};

function setFlag(key, val=true) { state.flags[key] = val; }
function hasFlag(key) { return !!state.flags[key]; }
function addItem(item) { if (!state.inventory.includes(item)) state.inventory.push(item); }
function hasItem(item) { return state.inventory.includes(item); }
function changeSanity(amount) {
  state.sanity = Math.max(0, Math.min(100, state.sanity + amount));
  updateUI();
}

function updateUI() {
  const bar = document.getElementById('sanity-value');
  bar.style.width = state.sanity + '%';
  bar.style.background = state.sanity > 60 ? '#2d5a27' : state.sanity > 30 ? '#b8860b' : '#8b2020';
  
  const inv = document.getElementById('inventory-text');
  inv.textContent = state.inventory.length ? state.inventory.join('、') : '無';
}

function setFloor(text) {
  document.getElementById('floor-text').textContent = text;
}

function screenEffect(type) {
  const el = document.createElement('div');
  el.className = 'screen-' + type;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2000);
}

// ===== STORY SCENES =====
const scenes = {

// ===== ACT 1: CHECK-IN =====
'start': {
  floor: '大堂',
  text: [
    '女朋友一年一日嘅生日又到，最麻煩莫過於要諗去邊到慶祝。',
    '好彩嘅係，唔知邊個發明咗喺酒店癡氣球慶祝生日呢回事，令到你嘅腦細胞得以保存。成個流程好簡單：帶上酒店、打卡、食蛋糕、飲香檳、上床搞嘢，訓覺，聽朝十二點鐘前退房，完成。',
    '為咗預先準備好，你特登早一日訂定房。',
    '地點係<span class="emphasis">康得思酒店</span>，即係朗豪坊嗰一間。',
    '記得嗰日返工要OT，你到夜晚先有時間去酒店搞，就決定索性喺嗰到訓一晚先，聽朝直接帶女朋友阿華過嚟。',
    '嗰晚落好大雨，成個朗豪坊乃至到行去酒店嘅路上都好靜，靜得你只係聽到玻璃外嘅狂風暴雨，商場幾乎可以講係一個人都無。',
    '直至你入到酒店大堂範圍，見到唯一企喺櫃檯嘅酒店職員，先稍為有啲放心。',
    '<span class="dialogue">「先生有咩幫到你？」</span>酒店職員嘅目光全程都望住你。',
    '<span class="dialogue">「訂咗房，我叫杜明。」</span>',
    '<span class="dialogue">「遲咗好多喎。」</span>',
    '<span class="dialogue">「係啊，有少少麻煩事。」</span>',
    '<span class="dialogue">「唔緊要，我照幫你。」</span>',
    '搞完一大輪手續之後，個酒店職員終於俾張匙卡你。',
    '<span class="dialogue">「有任何需要，可以打電話落嚟。」</span>',
    '你拎住匙卡，就去撳升降機。',
  ],
  choices: [{ text: '撳升降機去24樓', next: 'elevator_1' }]
},

'elevator_1': {
  floor: '升降機',
  text: [
    '「叮」到咗。',
    '你行入去，拎條匙卡插一插部升降機，然後撳二十四樓。',
    '一開始無反應，你以為自己用錯，不過撳多幾下就成功咗，部升降機終於合上咗門，你望住道門反射嘅自己，默默等待上去。',
    '<span class="scene-break">. . .</span>',
    '升降機一直上到五樓，突然間「叮」咗聲。',
    '門一打開，入面企住個<span class="emphasis">披頭散髮嘅女人</span>。',
    '老實講，你真係俾佢嚇親。',
    '你同佢對望咗幾秒，佢嘅眼神稍為瞪大咗，就好似見到啲咩嘢咁。',
    '佢低住頭咁行入嚟，呢個情況恐怖到你以為拍緊惡作劇。',
    '道門閂埋之後，升降機如常上升。',
    '部升降機越係上升，佢精神就好似越係失常咁。',
    '你偷偷哋喺後鏡望下佢個樣，結果竟然發現佢喺到<span class="emphasis">咧嘴偷笑</span>......',
    '你曾經聽過講咩升降機殺手，對方會特登低一層出去，然後轉身同你講一陣見，好彩呢種事無發生到，佢只係一直陪你搭到去二十四樓。',
    '嗯，一齊......',
  ],
  onEnter: () => changeSanity(-3),
  choices: [{ text: '終於到24樓，急步走出升降機', next: 'floor_24_dark' }]
},

'floor_24_dark': {
  floor: '24F',
  text: [
    '「叮」終於到咗二十四樓。',
    '經歷漫長等待，你迫不及待就要出去，邊個知道個女人身上會唔會收埋把刀，突然就插過嚟。',
    '門一開，你急步行出升降機，但走廊嘅情況令你有點訝異......',
    '因為出面居然係<span class="emphasis">昏暗一片</span>，僅僅係依靠住升降機入面自身亮住嘅光，你先睇到出面環境。',
    '因為咁嘅無光情況，令你行咗兩步就停低，結果後面突然發出「嗒嗒嗒嗒嗒......」嘅聲音，更加令你錯愕同一涼！',
    '你慢慢轉頭望向後面，發現嗰個精神有少少失常嘅女人，喺到不停撳緊閂門嗰個掣。',
    '就喺道門合上之前，佢對住你詭異咁笑，講咗句：',
    '<span class="dialogue emphasis">「多謝你嘻嘿嘿......」</span>',
    '<span class="scene-break">. . .</span>',
    '你完全唔知發生咩事，只係知身體暴露喺黑暗之中，令你畏懼感幾何級咁上升。',
    '如果呢個係酒店懲罰你遲入住嘅惡作劇，咁佢哋十分之成功，但你對呢間酒店將會永不錄用。',
    '最好笑嘅係，你居然可以俾到以上嘅籍口自己。',
    '喺無聲又無人嘅走廊到，你打開咗手機嘅電筒，白刺刺嘅光照住昏暗嘅長廊，你快速咁跑去自己嘅「2408」號房。',
    '酒店嘅走廊一般都會掛住啲畫，都不外乎係風景或者水果畫，但呢一間極之怪異，佢哋掛住啲好陰森嘅畫風作品，就例如成個背景都係暗紅色，中間企住個條頸好長嘅女人喺到笑，又或者係面色蒼白嘅畸形人喺到大笑。',
    '每望一幅，理智都好似被抽走一分咁，令到你不敢直視，快快咁行到去自己間房到。',
    '你用匙卡入到房之後，就即刻鎖門同開燈。好彩嘅係呢間房有燈光，成個人即刻安定唔少。',
    '本來你諗住打俾酒店禮賓部，點知打過去係無人聽。你拎手機出嚟撳，見到<span class="emphasis">無哂訊號</span>同WiFi。',
    '你以為自己返工返到攰咗，就諗都唔諗蓋被訓。',
    '<span class="narration">係，人面對恐怖嘅事情時，第一時間係會否定自己面對嘅事實。</span>',
  ],
  onEnter: () => { screenEffect('dark'); changeSanity(-5); setFloor('2408'); },
  choices: [{ text: '瞓覺', next: 'morning_wake' }]
},

// ===== ACT 2: THE VOID & ELISA =====
'morning_wake': {
  floor: '2408',
  text: [
    '<span class="scene-break">. . .</span>',
    '奇怪嘅係，你從來都係唔夠訓嘅代表，但今日你竟然訓到頸都痛埋。',
    '你打開手機，見到時間已經係朝早十點幾，但係窗外面好似都未光過咁。',
    '於是你行過去打開窗簾，結果眼前一黑。',
    '<span class="emphasis">真係眼前一片漆黑。</span>',
    '窗外面完完全全係漆黑嘅畫面，無任何應該見到嘅香港建築、無任何藍天白雲、無光線同任何嘢，就係得一片黑色，就好似虛空咁。',

// ===== RENDER ENGINE =====
function renderScene(sceneId) {
  const scene = scenes[sceneId];
  if (!scene) { console.error('Scene not found:', sceneId); return; }
  
  state.currentScene = sceneId;
  state.history.push(sceneId);
  
  if (scene.onEnter) scene.onEnter();
  if (scene.floor) setFloor(scene.floor);
  
  updateUI();
  
  const storyEl = document.getElementById('story-text');
  const choicesEl = document.getElementById('choices-container');
  
  storyEl.innerHTML = '';
  choicesEl.innerHTML = '';
  
  // Render text with typewriter-like paragraph animation
  scene.text.forEach((paragraph, i) => {
    const p = document.createElement('p');
    p.innerHTML = paragraph;
    p.style.animationDelay = (i * 0.1) + 's';
    storyEl.appendChild(p);
  });
  
  // Render choices or ending
  if (scene.ending) {
    setTimeout(() => {
      const endDiv = document.createElement('div');
      endDiv.className = 'ending-screen';
      endDiv.innerHTML = `
        <h2>— 完 —</h2>
        <div class="ending-type">${scene.endingType}</div>
        <p style="color:var(--text-dim);margin-bottom:1.5rem;">${scene.endingDesc}</p>
        <p style="color:var(--text-dim);font-size:0.75rem;">理智剩餘：${state.sanity}%</p>
        <p style="color:var(--text-dim);font-size:0.75rem;">經過場景：${state.history.length} 個</p>
        <button class="start-btn" style="margin-top:1.5rem;" onclick="restartGame()">
          <span>重新開始</span>
        </button>
      `;
      choicesEl.appendChild(endDiv);
      // Scroll to bottom
      const container = document.getElementById('story-container');
      container.scrollTop = container.scrollHeight;
    }, scene.text.length * 100 + 500);
  } else {
    setTimeout(() => {
      scene.choices.forEach(choice => {
        // Check if choice has a condition and if it's met
        if (choice.condition && !choice.condition()) return;
        
        const btn = document.createElement('button');
        btn.className = 'choice-btn' + (choice.danger ? ' danger' : '');
        btn.textContent = choice.text;
        btn.onclick = () => {
          if (choice.onSelect) choice.onSelect();
          renderScene(choice.next);
        };
        choicesEl.appendChild(btn);
      });
      // Scroll to bottom
      const container = document.getElementById('story-container');
      container.scrollTop = container.scrollHeight;
    }, scene.text.length * 100 + 300);
  }
}

function restartGame() {
  state.sanity = 100;
  state.inventory = [];
  state.flags = {};
  state.history = [];
  renderScene('start');
}

// ===== INIT =====
document.getElementById('start-btn').addEventListener('click', () => {
  document.getElementById('title-screen').classList.add('hidden');
  document.getElementById('game-screen').classList.remove('hidden');
  renderScene('start');
});

document.getElementById('restart-btn').addEventListener('click', restartGame);
</script>
</body>
</html>
