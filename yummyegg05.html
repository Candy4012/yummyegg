<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>女朋友全家變咗隻蛋 — 文字冒險遊戲</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Zen+Kurenaido&family=DotGothic16&display=swap" rel="stylesheet">
<style>
/* === RESET & BASE === */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0f;--bg2:#12121a;--fg:#e8e0d4;--accent:#c4362a;
  --accent2:#ff6b5a;--gold:#d4a853;--pink:#f5b0c8;
  --rabbit-white:#f0ebe3;--shadow:rgba(196,54,42,.15);
  --font-title:'Noto Serif TC',serif;--font-body:'Zen Kurenaido',sans-serif;
  --font-pixel:'DotGothic16',monospace;
}
html{font-size:16px;scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);
  min-height:100vh;overflow-x:hidden;line-height:1.8}

/* === NOISE OVERLAY === */
body::before{content:'';position:fixed;inset:0;z-index:9999;pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  opacity:.4}

/* === SCROLLBAR === */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--accent);border-radius:2px}

/* === LAYOUT === */
#game-container{max-width:720px;margin:0 auto;padding:2rem 1.5rem;position:relative;min-height:100vh}

/* === TITLE SCREEN === */
#title-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;text-align:center;animation:fadeIn 2s ease}
#title-screen h1{font-family:var(--font-title);font-size:2.4rem;font-weight:900;
  color:var(--fg);letter-spacing:.15em;margin-bottom:.5rem;
  text-shadow:0 0 40px var(--shadow),0 0 80px rgba(196,54,42,.08)}
#title-screen .subtitle{font-size:.9rem;color:var(--accent);letter-spacing:.3em;
  margin-bottom:3rem;font-family:var(--font-pixel)}
#title-screen .egg-icon{font-size:4rem;margin-bottom:2rem;
  animation:float 3s ease-in-out infinite;filter:drop-shadow(0 0 20px var(--shadow))}
#title-screen .start-btn{background:none;border:1px solid var(--accent);color:var(--accent);
  padding:.8rem 3rem;font-family:var(--font-body);font-size:1rem;cursor:pointer;
  letter-spacing:.2em;transition:all .4s ease;position:relative;overflow:hidden}
#title-screen .start-btn:hover{background:var(--accent);color:var(--bg);
  box-shadow:0 0 30px var(--shadow)}
#title-screen .start-btn::after{content:'';position:absolute;top:50%;left:50%;
  width:0;height:0;background:rgba(255,255,255,.1);border-radius:50%;
  transform:translate(-50%,-50%);transition:width .6s,height .6s}
#title-screen .start-btn:hover::after{width:300px;height:300px}
.title-rabbit{position:absolute;opacity:.06;font-size:8rem;
  animation:drift 20s linear infinite}
.title-rabbit:nth-child(1){top:10%;left:5%;animation-delay:0s}
.title-rabbit:nth-child(2){top:60%;right:5%;animation-delay:-7s;font-size:6rem}
.title-rabbit:nth-child(3){bottom:15%;left:15%;animation-delay:-13s;font-size:10rem}

/* === GAME SCREEN === */
#game-screen{display:none;padding-top:2rem;padding-bottom:4rem}

/* Status bar */
#status-bar{position:fixed;top:0;left:0;right:0;z-index:100;
  background:linear-gradient(180deg,var(--bg) 60%,transparent);
  padding:.8rem 1.5rem;display:flex;justify-content:space-between;align-items:center;
  font-family:var(--font-pixel);font-size:.7rem;color:var(--gold)}
#status-bar .chapter-name{color:var(--accent);letter-spacing:.15em}
#status-bar .inventory-count{cursor:pointer;transition:color .3s}
#status-bar .inventory-count:hover{color:var(--accent2)}

/* Story text area */
#story-area{margin-top:3rem}
.scene-image{width:100%;height:200px;border-radius:4px;margin-bottom:1.5rem;
  background:var(--bg2);border:1px solid rgba(196,54,42,.1);
  display:flex;align-items:center;justify-content:center;
  font-size:3rem;overflow:hidden;position:relative}
.scene-image::after{content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 60%,var(--bg))}

#story-text{font-size:1.05rem;line-height:2;margin-bottom:2rem;
  white-space:pre-wrap;animation:textReveal .8s ease}
#story-text .highlight{color:var(--accent2);font-weight:bold}
#story-text .whisper{color:rgba(232,224,212,.4);font-style:italic}
#story-text .system{color:var(--gold);font-family:var(--font-pixel);font-size:.85rem}

/* Choices */
#choices{display:flex;flex-direction:column;gap:.6rem;margin-top:1.5rem}
.choice-btn{background:var(--bg2);border:1px solid rgba(196,54,42,.2);
  color:var(--fg);padding:.9rem 1.2rem;font-family:var(--font-body);font-size:.95rem;
  cursor:pointer;text-align:left;transition:all .3s ease;position:relative;
  border-radius:2px;line-height:1.6}
.choice-btn:hover{border-color:var(--accent);background:rgba(196,54,42,.08);
  padding-left:1.6rem}
.choice-btn::before{content:'▸';position:absolute;left:.5rem;opacity:0;
  color:var(--accent);transition:opacity .3s}
.choice-btn:hover::before{opacity:1}
.choice-btn.puzzle-choice{border-color:var(--gold);border-style:dashed}
.choice-btn.puzzle-choice:hover{border-color:var(--gold);background:rgba(212,168,83,.08)}

/* Puzzle input */
#puzzle-area{margin-top:1rem;display:none}
#puzzle-input{background:var(--bg2);border:1px solid var(--gold);color:var(--gold);
  padding:.6rem 1rem;font-family:var(--font-pixel);font-size:1rem;width:100%;
  outline:none;border-radius:2px}
#puzzle-input:focus{box-shadow:0 0 15px rgba(212,168,83,.15)}
#puzzle-submit{background:var(--gold);color:var(--bg);border:none;padding:.5rem 1.5rem;
  font-family:var(--font-body);cursor:pointer;margin-top:.5rem;font-size:.9rem;
  border-radius:2px;transition:opacity .3s}
#puzzle-submit:hover{opacity:.8}
#puzzle-hint{color:rgba(232,224,212,.4);font-size:.8rem;margin-top:.5rem;font-style:italic}

/* Inventory panel */
#inventory-panel{position:fixed;top:0;right:-320px;width:300px;height:100vh;
  background:var(--bg2);border-left:1px solid rgba(196,54,42,.15);z-index:200;
  padding:2rem 1.5rem;transition:right .4s ease;overflow-y:auto}
#inventory-panel.open{right:0}
#inventory-panel h3{font-family:var(--font-title);color:var(--gold);margin-bottom:1rem;
  font-size:1.1rem;letter-spacing:.1em}
#inventory-panel .inv-item{padding:.5rem 0;border-bottom:1px solid rgba(255,255,255,.05);
  font-size:.9rem;color:var(--fg);position:relative}
#inventory-panel .inv-item .item-icon{margin-right:.5rem}
#inventory-panel .inv-item:hover{background:rgba(196,54,42,.05)}
#inventory-panel .inv-item::after{content:attr(data-desc);display:none;position:absolute;
  left:0;top:100%;background:var(--bg);border:1px solid var(--accent);padding:.5rem;
  font-size:.75rem;color:var(--fg);width:250px;z-index:10;line-height:1.5;
  border-radius:2px;white-space:normal}
#inventory-panel .inv-item:hover::after{display:block}
#inv-close{position:absolute;top:1rem;right:1rem;background:none;border:none;
  color:var(--fg);font-size:1.2rem;cursor:pointer}
#inv-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:150;
  display:none;cursor:pointer}
#inv-overlay.show{display:block}

/* Ending screen */
#ending-screen{display:none;text-align:center;padding-top:15vh}
#ending-screen h2{font-family:var(--font-title);font-size:2rem;margin-bottom:1rem}
#ending-screen .ending-type{font-family:var(--font-pixel);font-size:.8rem;
  letter-spacing:.3em;margin-bottom:2rem}
#ending-screen .ending-text{font-size:1rem;line-height:2;margin-bottom:3rem;
  max-width:500px;margin-left:auto;margin-right:auto}
#ending-screen .restart-btn{background:none;border:1px solid var(--accent);
  color:var(--accent);padding:.7rem 2rem;font-family:var(--font-body);cursor:pointer;
  font-size:.95rem;transition:all .3s}
#ending-screen .restart-btn:hover{background:var(--accent);color:var(--bg)}

/* === ANIMATIONS === */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes textReveal{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
@keyframes drift{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-30px) rotate(5deg)}100%{transform:translateY(0) rotate(0deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes glitch{0%{transform:translate(0)}20%{transform:translate(-2px,2px)}40%{transform:translate(2px,-2px)}60%{transform:translate(-1px,-1px)}80%{transform:translate(1px,1px)}100%{transform:translate(0)}}
.shake{animation:shake .3s ease}
.glitch{animation:glitch .2s ease 3}
.fade-in{animation:fadeIn .6s ease}

/* === FLOATING PARTICLES === */
#particles{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.particle{position:absolute;width:2px;height:2px;background:var(--accent);border-radius:50%;
  opacity:0;animation:particleFloat linear infinite}
@keyframes particleFloat{
  0%{transform:translateY(100vh) translateX(0);opacity:0}
  10%{opacity:.3}
  90%{opacity:.3}
  100%{transform:translateY(-10vh) translateX(30px);opacity:0}
}

/* === SCENE IMAGE ENHANCED === */
.scene-image{
  background:radial-gradient(ellipse at center,rgba(196,54,42,.08) 0%,var(--bg2) 70%);
  border:1px solid rgba(196,54,42,.15);
  text-shadow:0 0 30px var(--shadow);
  transition:all .5s ease;
  font-size:3.5rem}
.scene-image::before{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.03) 2px,rgba(0,0,0,.03) 4px);
  pointer-events:none;z-index:1}

/* === CHOICE HOVER GLOW === */
.choice-btn:active{transform:scale(.98)}

/* === ENDING SCREEN ENHANCEMENTS === */
#ending-screen{animation:fadeIn 2s ease}
#ending-screen .ending-type{
  padding:.3rem 1rem;border:1px solid currentColor;display:inline-block;
  border-radius:2px;letter-spacing:.4em}

/* === SKIP INDICATOR === */
#skip-hint{position:fixed;bottom:1rem;right:1rem;font-family:var(--font-pixel);
  font-size:.65rem;color:rgba(232,224,212,.2);z-index:50;
  animation:pulse 2s ease infinite}

/* === RESPONSIVE === */
@media(max-width:600px){
  #game-container{padding:1.5rem 1rem}
  #title-screen h1{font-size:1.8rem}
  #story-text{font-size:.95rem}
  .choice-btn{font-size:.9rem;padding:.7rem 1rem}
  .scene-image{height:150px;font-size:2.5rem}
}
</style>
</head>
<body>
<div id="game-container">

<!-- PARTICLES -->
<div id="particles"></div>

<!-- SKIP HINT -->
<div id="skip-hint" style="display:none">點擊文字可跳過動畫</div>

<!-- TITLE SCREEN -->
<div id="title-screen">
  <div class="title-rabbit">🐰</div>
  <div class="title-rabbit">🐰</div>
  <div class="title-rabbit">🐰</div>
  <div class="egg-icon">🥚</div>
  <h1>女朋友全家變咗隻蛋</h1>
  <div class="subtitle">E G G &nbsp; I S &nbsp; A &nbsp; L I E</div>
  <button class="start-btn" onclick="startGame()">開 始 遊 戲</button>
</div>

<!-- GAME SCREEN -->
<div id="game-screen">
  <div id="status-bar">
    <span class="chapter-name" id="chapter-label">序章</span>
    <span class="inventory-count" id="inv-toggle" onclick="toggleInventory()">🎒 道具 (<span id="inv-num">0</span>)</span>
  </div>
  <div id="story-area">
    <div class="scene-image" id="scene-img"></div>
    <div id="story-text"></div>
    <div id="puzzle-area">
      <input type="text" id="puzzle-input" placeholder="輸入答案...">
      <button id="puzzle-submit" onclick="submitPuzzle()">確認</button>
      <div id="puzzle-hint"></div>
    </div>
    <div id="choices"></div>
  </div>
</div>

<!-- INVENTORY PANEL -->
<div id="inv-overlay" onclick="toggleInventory()"></div>
<div id="inventory-panel">
  <button id="inv-close" onclick="toggleInventory()">✕</button>
  <h3>🎒 道具欄</h3>
  <div id="inv-list"></div>
</div>

<!-- ENDING SCREEN -->
<div id="ending-screen">
  <div id="ending-icon" style="font-size:4rem;margin-bottom:1rem"></div>
  <h2 id="ending-title"></h2>
  <div class="ending-type" id="ending-type"></div>
  <div class="ending-text" id="ending-text"></div>
  <button class="restart-btn" onclick="location.reload()">重新開始</button>
</div>

</div>

<script>
/* === PARTICLES === */
function createParticles() {
  const container = document.getElementById('particles');
  for (let i = 0; i < 20; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (8 + Math.random() * 12) + 's';
    p.style.animationDelay = Math.random() * 10 + 's';
    p.style.width = (1 + Math.random() * 2) + 'px';
    p.style.height = p.style.width;
    container.appendChild(p);
  }
}
createParticles();

/* === GAME STATE === */
const state = {
  currentNode: null,
  inventory: [],
  flags: {},
  chapter: '序章',
  history: [],
  puzzleActive: false,
  currentPuzzle: null,
  typing: false
};

/* === STORY DATA === */
const story = {
/* --- PROLOGUE --- */
'prologue_1': {
  chapter: '序章',
  icon: '🌃',
  text: `自從嗰件事之後，我對「蛋」患咗嚴重嘅抗拒症狀。

但一切，要由嗰個復活節嘅夜晚講起。

嗰晚我搭緊小巴去女朋友 Chloe 嘅屋企。我哋拍拖三年，唯獨呢個月無見過佢，因為佢同家人去咗智利旅行。

奇怪嘅係，佢返嚟之後只用手機覆咗我幾句，就完全消失咗。

最後上線時間，永遠停留喺三日前嘅凌晨四點鐘。

我決定親自上去搵佢。`,
  choices: [
    { text: '繼續', next: 'prologue_2' }
  ]
},
'prologue_2': {
  chapter: '序章',
  icon: '🚐',
  text: `「翠林邨有落。」

小巴一停，我默默行入去佢住嘅大廈。走廊有些小陰沉，夜晚啲風一吹入嚟，多少都會發寒。

行到門口，我見到佢屋企道大門未閂好⋯⋯露出咗一條小門縫。

「唔會呱⋯⋯」

我吞一吞口水，慢慢推開門：

「Chloe！？」`,
  choices: [
    { text: '行入去', next: 'ch1_enter' }
  ]
},

/* --- CHAPTER 1: THE APARTMENT --- */
'ch1_enter': {
  chapter: '第一章 蛋',
  icon: '🚪',
  text: `行入去第一步，就感受到自己踩到水面。

低頭一望，成個地下都係水跡。再細心聽，可以聽到廁所嗰邊開住水。

Chloe 間屋係三房一廳，同細佬父母一齊住。但此刻成間屋浸水咁，好難相信佢哋喺屋入面。

屋內亮住白色燈管，電視機亦開住。

一個人都無。

<span class="whisper">（要仔細搜索每一間房⋯⋯說唔定有重要線索。）</span>`,
  choices: [
    { text: '搜索客廳', next: 'ch1_living_room' },
    { text: '先去廁所睇下', next: 'ch1_bathroom' },
    { text: '先入 Chloe 細佬間房', next: 'ch1_brother' },
    { text: '直接去 Chloe 間房', next: 'ch1_chloe_room' }
  ]
},
'ch1_living_room': {
  chapter: '第一章 蛋',
  icon: '📺',
  text: `客廳得部開住咗嘅電視。螢幕閃住雪花，似乎冇訊號。

我行過去想閂電視，但留意到電視櫃下面有啲嘢⋯⋯

一隻鞋。男裝，42碼。係外父嘅鞋。

鞋入面塞住一張紙條。

<span class="whisper">「如果出事，去床底。——源」</span>

「源」？邊個叫「源」嘅人留低呢張紙？

我再仔細望下電視櫃⋯⋯抽屜入面有一把备用門匙，同一個寫住「重生會——翠林分部」嘅徽章。

<span class="system">【獲得道具：外父嘅鞋（內有紙條）】</span>
<span class="system">【獲得道具：重生會徽章】</span>
<span class="system">【獲得線索：「去床底」】</span>`,
  onEnter: (s) => {
    addItem(s, '外父嘅鞋', '👞');
    addItem(s, '重生會徽章', '📛');
    setFlag(s, 'found_shoe_clue');
    setFlag(s, 'know_bed_hint');
  },
  choices: [
    { text: '去廁所', next: 'ch1_bathroom' },
    { text: '去細佬間房', next: 'ch1_brother' },
    { text: '去 Chloe 間房', next: 'ch1_chloe_room' },
    { text: '檢查父母房間嘅床底', next: 'ch1_under_bed' }
  ]
},
'ch1_under_bed': {
  chapter: '第一章 蛋',
  icon: '🛏️',
  text: `我衝入父母房間，趴落地望床底。

塵好多⋯⋯但入面確實有嘢。

一個鐵盒。上面有鎖，但鎖好細。

我用力拉開——入面有一疊相片同一本手寫筆記。

相片係外父同嗰個叫「源」嘅人嘅合照。佢哋著住重生會嘅袍，笑得好開心。

手寫筆記嘅最後一頁：

<span class="whisper">「譚國源話只要完成儀式，我嘅癌就可以好返。
我知呢個係賭博。但為咗屋企人，我願意試。
如果我變咗蛋⋯⋯拜託邊個都好，搵到隻蛋，唔好打破佢。
——洪志偉」</span>

<span class="highlight">外父⋯⋯一早知道自己會變蛋？</span>

<span class="system">【獲得道具：鐵盒筆記】</span>
<span class="system">【獲得線索：外父嘅自白】</span>`,
  onEnter: (s) => {
    addItem(s, '鐵盒筆記', '📓');
    setFlag(s, 'found_iron_box');
    setFlag(s, 'know_father_willing');
  },
  choices: [
    { text: '去廁所', next: 'ch1_bathroom', condition: (s) => !s.flags.found_father_egg },
    { text: '去細佬間房', next: 'ch1_brother', condition: (s) => !s.flags.broke_brother_egg },
    { text: '去 Chloe 間房', next: 'ch1_chloe_room' }
  ]
},
'ch1_bathroom': {
  chapter: '第一章 蛋',
  icon: '🛁',
  text: `我行去廁所，發現花灑一直開住水。浴缸浸滿水，而水面浮住⋯⋯

一隻蛋。

蛋殼上繪畫住一個人類臉孔——戴黑眼鏡、鼻大大、留鬚。

係 Chloe 爸爸嘅樣。

我小心翼翼咁拎起隻蛋，蛋殼微微溫熱，好似有嘢喺入面脈緊咁。

洗手盤上面仲有一條濕咗嘅毛巾，同一支開咗蓋嘅沐浴乳。似乎有人好匆忙咁離開。

喺毛巾下面，我搵到一條頸鏈——十字架形狀，同重生會封信上面嘅 Logo 一模一樣。

<span class="system">【獲得道具：外父嘅復活蛋】</span>
<span class="system">【獲得道具：重生會頸鏈】</span>`,
  onEnter: (s) => { addItem(s, '外父嘅復活蛋', '🥚'); addItem(s, '重生會頸鏈', '📿'); setFlag(s, 'found_father_egg'); },
  choices: [
    { text: '去 Chloe 細佬間房', next: 'ch1_brother' },
    { text: '去 Chloe 間房', next: 'ch1_chloe_room' },
    { text: '去客廳', next: 'ch1_living_room', condition: (s) => !s.flags.found_shoe_clue }
  ]
},
'ch1_brother': {
  chapter: '第一章 蛋',
  icon: '🎮',
  text: `我推開細佬間房。

/* === GAME ENGINE === */
function addItem(s, name, icon) {
  if (!s.inventory.find(i => i.name === name)) {
    s.inventory.push({ name, icon });
    updateInventoryUI();
  }
}
function setFlag(s, flag) { s.flags[flag] = true; }
function hasItem(s, name) { return s.inventory.some(i => i.name === name); }

function updateInventoryUI() {
  document.getElementById('inv-num').textContent = state.inventory.length;
  const list = document.getElementById('inv-list');
  list.innerHTML = '';
  state.inventory.forEach(item => {
    const div = document.createElement('div');
    div.className = 'inv-item';
    div.setAttribute('data-desc', itemDescriptions[item.name] || '未知道具');
    div.innerHTML = `<span class="item-icon">${item.icon}</span>${item.name}`;
    list.appendChild(div);
  });
}

function toggleInventory() {
  document.getElementById('inventory-panel').classList.toggle('open');
  document.getElementById('inv-overlay').classList.toggle('show');
}

function startGame() {
  document.getElementById('title-screen').style.display = 'none';
  document.getElementById('game-screen').style.display = 'block';
  goToNode('prologue_1');
}

function goToNode(nodeId) {
  const node = story[nodeId];
  if (!node) { console.error('Node not found:', nodeId); return; }

  state.currentNode = nodeId;
  state.history.push(nodeId);

  // Update chapter
  if (node.chapter) {
    state.chapter = node.chapter;
    document.getElementById('chapter-label').textContent = node.chapter;
  }

  // Scene image
  document.getElementById('scene-img').textContent = node.icon || '🥚';

  // Run onEnter
  if (node.onEnter) node.onEnter(state);

  // Story text with typewriter effect
  const textEl = document.getElementById('story-text');
  textEl.innerHTML = '';
  typewriterEffect(textEl, node.text, () => {
    showChoices(node);
  });

  // Handle puzzle
  if (node.puzzle) {
    state.puzzleActive = true;
    state.currentPuzzle = node.puzzle;
    document.getElementById('puzzle-area').style.display = 'block';
    document.getElementById('puzzle-input').value = '';
    document.getElementById('puzzle-hint').textContent = '';
    document.getElementById('puzzle-input').focus();
  } else {
    state.puzzleActive = false;
    document.getElementById('puzzle-area').style.display = 'none';
  }

  // Scroll to top
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function typewriterEffect(el, html, callback) {
  state.typing = true;
  document.getElementById('skip-hint').style.display = 'block';
  // Parse HTML and reveal character by character
  el.innerHTML = html;
  const fullHTML = el.innerHTML;
  el.innerHTML = '';

  let i = 0;
  let inTag = false;
  let buffer = '';
  const speed = 18;

  function tick() {
    if (i >= fullHTML.length) {
      state.typing = false;
      document.getElementById('skip-hint').style.display = 'none';
      if (callback) callback();
      return;
    }
    const char = fullHTML[i];
    if (char === '<') inTag = true;
    if (inTag) {
      buffer += char;
      if (char === '>') {
        inTag = false;
        el.innerHTML += buffer;
        buffer = '';
      }
      i++;
      tick();
      return;
    }
    el.innerHTML += char;
    i++;
    setTimeout(tick, speed);
  }

  // Allow click to skip
  el.onclick = () => {
    if (state.typing) {
      state.typing = false;
      el.innerHTML = fullHTML;
      el.onclick = null;
      document.getElementById('skip-hint').style.display = 'none';
      if (callback) callback();
    }
  };

  tick();
}

function showChoices(node) {
  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';

  const validChoices = node.choices.filter(c => {
    if (c.condition) return c.condition(state);
    return true;
  });

  validChoices.forEach((choice, idx) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    if (choice.puzzle) btn.classList.add('puzzle-choice');
    btn.textContent = choice.text;
    btn.style.animationDelay = (idx * 0.1) + 's';
    btn.classList.add('fade-in');
    btn.onclick = () => {
      if (choice.addItem) addItem(state, choice.addItem, choice.itemIcon || '📦');
      if (choice.setFlag) setFlag(state, choice.setFlag);
      goToNode(choice.next);
    };
    choicesEl.appendChild(btn);
  });
}

function submitPuzzle() {
  if (!state.puzzleActive || !state.currentPuzzle) return;

  const input = document.getElementById('puzzle-input').value.trim();
  const puzzle = state.currentPuzzle;

  if (puzzle.type === 'item_puzzle') {
    const hasRequired = puzzle.items_needed.every(name => hasItem(state, name));
    if (hasRequired) {
      state.puzzleActive = false;
      document.getElementById('puzzle-area').style.display = 'none';
      goToNode(puzzle.success);
    } else {
      goToNode(puzzle.fail);
    }
    return;
  }

  if (input === puzzle.answer) {
    state.puzzleActive = false;
    document.getElementById('puzzle-area').style.display = 'none';
    goToNode(puzzle.success);
  } else {
    document.getElementById('puzzle-hint').textContent = puzzle.hint || '答案唔啫，再試下。';
    document.getElementById('puzzle-input').value = '';
    document.getElementById('puzzle-input').classList.add('shake');
    setTimeout(() => {
      document.getElementById('puzzle-input').classList.remove('shake');
    }, 300);
  }
}

// Enter key for puzzle
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && state.puzzleActive) submitPuzzle();
});

function showEnding(s, endingId) {
  const ending = endings[endingId];
  if (!ending) return;

  setTimeout(() => {
    document.getElementById('game-screen').style.display = 'none';
    const endScreen = document.getElementById('ending-screen');
    endScreen.style.display = 'block';
    document.getElementById('ending-icon').textContent = ending.icon;
    document.getElementById('ending-title').textContent = ending.title;
    document.getElementById('ending-title').style.color = ending.color;
    document.getElementById('ending-type').textContent = ending.type;
    document.getElementById('ending-type').style.color = ending.color;
    document.getElementById('ending-text').textContent = ending.text;
  }, 2000);
}
